name: Frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

# Permisos mínimos por defecto; el despliegue pide los suyos.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Calcular ruta base de GitHub Pages
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then echo "path=/" >> "$GITHUB_OUTPUT"
          else echo "path=/${repo}/" >> "$GITHUB_OUTPUT"; fi

      - name: Compilación de producción
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          # Variables públicas: Settings > Secrets and variables > Actions > Variables.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_BUSINESS_NUMBER: ${{ vars.VITE_WHATSAPP_BUSINESS_NUMBER }}

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
